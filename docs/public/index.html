<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Solard documentation for the SDK, CLI, trading engine, event history, and Meteora automation." />
    <meta name="theme-color" content="#0a0d12" />
    <title>Solard Docs</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="noise"></div>
    <header class="topbar">
      <a class="brand" href="#/overview" aria-label="Solard docs home">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span class="brand-text">Solard</span>
        <span class="brand-tag">docs</span>
      </a>
      <div class="topbar-actions">
        <button class="search-trigger" id="search-trigger" type="button" aria-label="Search documentation">
          <span>Search docs</span>
          <kbd>/</kbd>
        </button>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Toggle color theme"></button>
        <button class="icon-button mobile-only" id="menu-toggle" type="button" aria-label="Open navigation"></button>
      </div>
    </header>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Documentation navigation">
        <nav id="navigation"></nav>
        <div class="sidebar-footer">
          <span class="status-dot"></span>
          <span>SDK · CLI · Core</span>
        </div>
      </aside>

      <main class="main" id="main" tabindex="-1">
        <article id="content" class="doc"></article>
      </main>

      <aside class="toc" aria-label="On this page">
        <div class="toc-label">On this page</div>
        <nav id="toc"></nav>
      </aside>
    </div>

    <dialog class="search-dialog" id="search-dialog">
      <div class="search-box">
        <div class="search-input-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" /></svg>
          <input id="search-input" type="search" autocomplete="off" placeholder="Search Solard docs…" />
          <kbd>Esc</kbd>
        </div>
        <div class="search-results" id="search-results"></div>
        <div class="search-hint">Use ↑ ↓ to navigate · Enter to open</div>
      </div>
    </dialog>

    <script type="module" src="./app.js"></script>
  </body>
</html>
